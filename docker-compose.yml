services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - SESSIONS_DIR=/app/.sessions
      - APP_CONFIG_PATH=/app/.runtime/ai-config.json
    volumes:
      - ./.sessions:/app/.sessions
      - ./.runtime:/app/.runtime

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://server:8000
    depends_on:
      - server
